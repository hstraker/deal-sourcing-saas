name: Deploy dealapp to production

# Two ways to trigger:
# 1. Push to main -> deploys through the protected "production" environment,
#    which pauses for your manual approval in the GitHub Actions tab.
# 2. Manual run (Actions tab -> Run workflow) with "skip_approval" ticked ->
#    deploys immediately through the unprotected "production-direct" environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_approval:
        description: "Deploy immediately, skip the manual approval gate"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_approval == true) && 'production-direct' || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy
        # DATABASE_URL is read from the .env file already sitting in this
        # directory on the server. Only add a DATABASE_URL secret + env block
        # here if you'd rather manage it from GitHub instead.

      - name: Build app (skipped if no build script)
        run: npm run build --if-present

      - name: Reload app with pm2 (zero downtime)
        run: pm2 reload dealapp --update-env
